
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User page</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="text-white">
        <span class="font-weight-bold" sec:authentication="name"></span>
        <span> with roles: </span>
        <span th:each="a, st : ${#authentication.authorities}"
              class="font-weight-bold"
              th:text="${#strings.replace(a.authority,'ROLE_','') + (st.last ? '' : ' ')}"></span>
    </div>

    <form th:action="@{/logout}" method="post" class="mb-0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="btn btn-link" type="submit"
                style="text-decoration: none; color: #6c757d;"
                onmouseover="this.style.setProperty('color', 'white', 'important');"
                onmouseout="this.style.setProperty('color', '#6c757d', 'important');">
            Logout
        </button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <div class="col-2 px-0 border-right" style="min-height: calc(100vh - 56px);">
            <div class="nav flex-column nav-pills" style="padding-top: 16px;">
                <a sec:authorize="hasRole('ADMIN')"
                   class="nav-link rounded-0"
                   th:href="@{/admin}">Admin</a>

                <a class="nav-link active rounded-0"
                   th:href="@{/user}">User</a>
            </div>
        </div>

        <div class="col-10 bg-light" style="min-height: calc(100vh - 56px);">
            <div class="pt-3 px-3">
                <h1 class="mb-3">User information-page</h1>

                <div class="card">
                    <div class="card-header" style="font-weight: bold;">About user</div>
                    <div class="card-body">

                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:with="p=${#authentication.principal}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.name}"></td>
                                <td th:text="${p.surname}"></td>
                                <td th:text="${p.age}"></td>
                                <td th:text="${p.username}"></td>
                                <td>
                  <span th:each="r, st : ${p.roles}"
                        th:text="${#strings.replace(r.name,'ROLE_','') + (st.last ? '' : ' ')}"></span>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
